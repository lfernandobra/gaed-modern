name: GAED Modern CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend Lint & Build (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type-check and build bundle
        run: npm run build

  backend:
    name: Backend Build, Seed & API Smoke Tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gaed_modern
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gaed_modern
      JWT_SECRET: ci-test-jwt-secret
      JWT_EXPIRES_IN: 1d
      PORT: "3001"
      UPLOAD_DIR: ./uploads
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Generate Prisma client, push schema & seed database
        run: |
          npx prisma generate
          npx prisma db push
          npm run db:seed

      - name: Compile TypeScript backend
        run: npm run build

      - name: Start API & run live integration smoke checks
        run: |
          node dist/server.js > /tmp/gaed-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/api/health >/dev/null; then
              echo "API health check OK."
              break
            fi
            if [ "$i" -eq 30 ]; then
              cat /tmp/gaed-api.log
              exit 1
            fi
            sleep 1
          done

          STATUS_UNAUTH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/usuarios)
          if [ "$STATUS_UNAUTH" != "401" ]; then
            echo "Expected 401 on unauthenticated /api/usuarios, got $STATUS_UNAUTH"
            exit 1
          fi

          LOGIN_RESP=$(curl -sf -X POST http://localhost:3001/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"login":"admin","senha":"123456"}')
          TOKEN=$(printf '%s' "$LOGIN_RESP" | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8')); if(!d.token) process.exit(1); console.log(d.token);")

          for route in /api/auth/me /api/usuarios /api/escola/turmas /api/escola/disciplinas /api/boletins /api/ocorrencias /api/tarefas; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" "http://localhost:3001${route}")
            echo "GET $route -> $CODE"
            if [ "$CODE" != "200" ]; then
              cat /tmp/gaed-api.log
              exit 1
            fi
          done
